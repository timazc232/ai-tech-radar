<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Tech Radar · V1.0 原型</title>
<style>
:root{
  --bg:#0a0f1a; --panel:#101827; --panel2:#0d1422; --border:#1e2a3d; --border2:#2a3a55;
  --text:#e6edf7; --muted:#8fa1b8; --dim:#5c6b82;
  --accent:#4f8cff; --must:#f5a524; --worth:#38bdf8; --ok:#2dd4a7; --err:#f4657a;
  --chip:#182338; --chip-border:#24344f;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:"Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  font-size:14px; line-height:1.55;
}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

/* ---------- layout ---------- */
#sidebar{
  position:fixed; top:0; left:0; bottom:0; width:216px;
  background:var(--panel2); border-right:1px solid var(--border);
  display:flex; flex-direction:column; padding:18px 12px;
}
.logo{display:flex;align-items:center;gap:9px;padding:2px 8px 16px;border-bottom:1px solid var(--border);margin-bottom:12px}
.logo .dot{width:30px;height:30px;border-radius:8px;background:radial-gradient(circle at 30% 30%,#6ea8ff,#2b5fd9);display:flex;align-items:center;justify-content:center;font-size:15px}
.logo b{font-size:15px;letter-spacing:.3px}
.logo small{display:block;color:var(--muted);font-weight:400;font-size:11px}
.nav-item{
  display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;
  color:var(--muted);font-size:13.5px;margin-bottom:2px;cursor:pointer;border:1px solid transparent;
}
.nav-item:hover{background:var(--chip);color:var(--text)}
.nav-item.active{background:var(--chip);color:var(--text);border-color:var(--chip-border)}
.nav-item .ico{width:18px;text-align:center;font-size:14px}
.nav-item .tag{margin-left:auto;font-size:10px;color:var(--dim);border:1px solid var(--border);padding:0 5px;border-radius:4px}
#sidebar .foot{margin-top:auto;color:var(--dim);font-size:11px;padding:10px 8px 0;border-top:1px solid var(--border)}
#main{margin-left:216px;min-height:100vh;padding:22px 28px 60px}
#topbar{display:flex;align-items:baseline;gap:14px;margin-bottom:18px;flex-wrap:wrap}
#topbar h1{font-size:19px;font-weight:650}
#topbar .sub{color:var(--muted);font-size:12.5px}
.proto-badge{margin-left:auto;font-size:11px;color:var(--must);border:1px solid #4a3a15;background:#20180a;padding:3px 9px;border-radius:20px}

/* ---------- summary strip ---------- */
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
.strip .cell{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 14px}
.strip .num{font-size:20px;font-weight:700}
.strip .lbl{color:var(--muted);font-size:11.5px;margin-top:1px}
.strip .num.warn{color:var(--must)} .strip .num.err{color:var(--err)} .strip .num.ok{color:var(--ok)}

/* ---------- sections & cards ---------- */
.sec-head{display:flex;align-items:center;gap:10px;margin:20px 0 10px}
.sec-head h2{font-size:14.5px;font-weight:650}
.sec-head .cnt{font-size:11px;color:var(--muted);background:var(--chip);border:1px solid var(--chip-border);padding:1px 8px;border-radius:12px}
.sec-head .hint{font-size:11.5px;color:var(--dim);margin-left:auto}
.ev-card{
  background:var(--panel);border:1px solid var(--border);border-radius:10px;
  padding:14px 16px;margin-bottom:10px;position:relative;
}
.ev-card.must{border-left:3px solid var(--must)}
.ev-card.worth{border-left:3px solid var(--worth)}
.ev-card.faded{opacity:.45}
.ev-head{display:flex;align-items:flex-start;gap:10px}
.ev-title{font-size:14.5px;font-weight:600;cursor:pointer}
.ev-title:hover{color:var(--accent)}
.score-badge{
  margin-left:auto;flex-shrink:0;min-width:44px;text-align:center;
  font-weight:700;font-size:15px;border-radius:8px;padding:4px 8px;
}
.score-badge.must{background:#241a08;color:var(--must);border:1px solid #4a3a15}
.score-badge.worth{background:#0a1c26;color:var(--worth);border:1px solid #1c3a4d}
.chip{
  display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);
  background:var(--chip);border:1px solid var(--chip-border);border-radius:5px;padding:1.5px 7px;margin:2px 4px 2px 0;
}
.chip.type{color:#b8c6e0}
.chip.gold{color:var(--must);border-color:#4a3a15;background:#20180a}
.chip.blue{color:var(--worth);border-color:#1c3a4d;background:#0a1c26}
.chip.green{color:var(--ok);border-color:#14432f;background:#08201a}
.chip.red{color:var(--err);border-color:#4d1c28;background:#200a10}
.ev-meta{margin-top:5px}
.ev-why{margin-top:9px;font-size:13px;color:#c3d0e4;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:9px 12px}
.ev-why b{color:var(--must);font-weight:600}
.ev-foot{display:flex;align-items:center;gap:8px;margin-top:11px;flex-wrap:wrap}
.btn{
  font-size:12px;color:var(--muted);background:var(--panel2);border:1px solid var(--border2);
  border-radius:7px;padding:4.5px 11px;cursor:pointer;font-family:inherit;
}
.btn:hover{color:var(--text);border-color:var(--accent)}
.btn.on{color:var(--accent);border-color:var(--accent);background:#101c33}
.btn.save-on{color:var(--must);border-color:var(--must);background:#241a08}
.btn.danger:hover{color:var(--err);border-color:var(--err)}
.reason-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.reason-row .lbl{font-size:12px;color:var(--muted)}
.reason-pick{font-size:12px;background:var(--chip);border:1px solid var(--chip-border);color:var(--text);border-radius:14px;padding:3px 11px;cursor:pointer}
.reason-pick:hover{border-color:var(--err);color:var(--err)}
.scoreline{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px}
.scoreline .dim{width:86px;color:var(--muted);flex-shrink:0}
.scoreline .bar{flex:1;height:6px;background:#16233a;border-radius:3px;overflow:hidden}
.scoreline .fill{height:100%;background:linear-gradient(90deg,#2b5fd9,#6ea8ff);border-radius:3px}
.scoreline .val{width:28px;text-align:right;color:var(--text);font-weight:600}
details.reasons{margin-top:8px}
details.reasons summary{font-size:12px;color:var(--accent);cursor:pointer;user-select:none}
.reason-codes{margin-top:7px;display:flex;flex-wrap:wrap;gap:5px}
.rc{font-family:Consolas,monospace;font-size:11px;background:#0a1c26;border:1px solid #1c3a4d;color:#7cc4e8;border-radius:5px;padding:2px 7px}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden}
th{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;text-align:left;padding:9px 12px;background:var(--panel2);border-bottom:1px solid var(--border)}
td{padding:9px 12px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#121c2e}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px}
.status .dot{width:7px;height:7px;border-radius:50%}
.status.ok .dot{background:var(--ok)} .status.ok{color:var(--ok)}
.status.warn .dot{background:var(--must)} .status.warn{color:var(--must)}
.status.err .dot{background:var(--err)} .status.err{color:var(--err)}
.status.dim .dot{background:var(--dim)} .status.dim{color:var(--muted)}

/* ---------- detail page ---------- */
.back{font-size:12.5px;color:var(--muted);cursor:pointer;margin-bottom:12px;display:inline-block}
.back:hover{color:var(--accent)}
.detail-grid{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
.panelbox{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px}
.panelbox h3{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:11px}
.card-field{margin-bottom:13px}
.card-field .k{font-size:11.5px;color:var(--must);font-weight:600;margin-bottom:3px}
.card-field .k.b{color:var(--worth)}
.card-field .v{font-size:13.5px;color:#d5deed}
.facts li{margin:5px 0 5px 18px;font-size:13px;color:#c3d0e4}
.evd{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);border-radius:8px;padding:9px 12px;margin-bottom:8px;background:var(--panel2)}
.evd .kind{font-size:11px;color:var(--worth);border:1px solid #1c3a4d;background:#0a1c26;border-radius:5px;padding:1px 7px;flex-shrink:0;margin-top:1px}
.evd .u{font-size:12.5px}
.evd .m{font-size:11px;color:var(--dim);margin-top:2px}
.rel{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--border);font-size:12.5px}
.rel:last-child{border-bottom:none}
.rel .d{color:var(--dim);flex-shrink:0}

/* ---------- misc ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{font-size:13px;padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer}
.tab.active{color:var(--text);border-color:var(--accent);background:#101c33}
.weightbar{width:120px;height:7px;background:#16233a;border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle}
.weightbar .fill{height:100%;background:linear-gradient(90deg,#7c3aed,#4f8cff)}
.toast-wrap{position:fixed;right:22px;bottom:22px;display:flex;flex-direction:column;gap:8px;z-index:99;max-width:420px}
.toast{
  background:#101c33;border:1px solid var(--accent);color:var(--text);
  border-radius:9px;padding:10px 15px;font-size:12.5px;box-shadow:0 6px 24px rgba(0,0,0,.5);
  animation:slidein .18s ease-out;
}
.toast.warn{border-color:var(--must)} .toast.err{border-color:var(--err)}
.toast code{font-family:Consolas,monospace;font-size:11px;color:#7cc4e8;background:#0a1c26;padding:1px 5px;border-radius:4px}
@keyframes slidein{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.brief-block{background:var(--panel2);border:1px dashed var(--border2);border-radius:10px;padding:14px 18px;font-size:13px;color:#c3d0e4}
.brief-block h4{font-size:12px;color:var(--must);margin:9px 0 4px}
.brief-block h4:first-child{margin-top:0}
.budgetbar{height:9px;background:#16233a;border-radius:5px;overflow:hidden;margin:7px 0}
.budgetbar .fill{height:100%;background:linear-gradient(90deg,var(--ok),var(--must))}
.form-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--border)}
.form-row:last-child{border-bottom:none}
.form-row .k{width:190px;color:var(--muted);font-size:13px;flex-shrink:0}
input[type=text],select{
  background:var(--panel2);border:1px solid var(--border2);color:var(--text);
  border-radius:7px;padding:6px 10px;font-size:13px;font-family:inherit;
}
.spark{display:inline-flex;align-items:flex-end;gap:2px;height:22px}
.spark i{width:5px;background:#2b5fd9;border-radius:1.5px;display:block}
.trend-up{color:var(--ok);font-weight:700}.trend-flat{color:var(--muted);font-weight:700}
.mini{font-size:11.5px;color:var(--dim)}
.empty-hint{color:var(--dim);font-size:12.5px;padding:14px;text-align:center;border:1px dashed var(--border);border-radius:10px}
</style>
</head>

/* ---------------- feedback ---------------- */
function feedbackState(ev){ return state.feedback[ev.id]; }

function feedbackBar(ev){
  const fb = feedbackState(ev);
  if (fb && fb.action==='irrelevant'){
    return `<div class="ev-foot"><span class="chip red">已标记不相关 · ${fb.reason}</span>
      <button class="btn" data-act="fb-undo" data-id="${ev.id}">撤销</button></div>`;
  }
  if (state.pendingReason === ev.id){
    return `<div class="reason-row"><span class="lbl">选择不相关原因：</span>
      ${['泛营销','纯融资','重复内容','与我方向无关','其他'].map(r=>
        `<button class="reason-pick" data-act="reason-pick" data-id="${ev.id}" data-reason="${r}">${r}</button>`).join('')}
      <button class="btn" data-act="reason-cancel">取消</button></div>`;
  }
  const saved = fb && fb.action==='save';
  const useful = fb && fb.action==='useful';
  const later = state.laterIds.includes(ev.id);
  return `<div class="ev-foot">
    <button class="btn ${useful?'on':''}" data-act="fb-useful" data-id="${ev.id}">✓ 有用</button>
    <button class="btn" data-act="fb-irrelevant" data-id="${ev.id}">✕ 不相关</button>
    <button class="btn ${saved?'save-on':''}" data-act="fb-save" data-id="${ev.id}">★ ${saved?'已收藏':'收藏'}</button>
    <button class="btn ${later?'on':''}" data-act="fb-later" data-id="${ev.id}">◷ ${later?'已稍后':'稍后再看'}</button>
    <span class="mini" style="margin-left:auto">反馈将在下次排序生效 · 可撤销</span>
  </div>`;
}

function applyFeedback(evId, action, reason){
  const ev = EVENTS.find(e=>e.id===evId);
  const mainTopic = ev.topics[0];
  const now = '08-07 09:1' + Math.floor(Math.random()*9);
  if (action==='useful'){
    state.feedback[evId] = {action};
    state.weights[mainTopic] = Math.min(1.0, +(state.weights[mainTopic]+0.03).toFixed(2));
    state.weightLog.unshift({topic:mainTopic, delta:+0.03, at:'08-07', reason:'feedback:useful'});
    state.memFeedback.unshift({at:now, event:ev.title, action:'useful', effect:`${topicName(mainTopic)} +0.03`});
    toast(`已记录 <b>有用</b> → Interest Memory：<b>${topicName(mainTopic)}</b> 权重 +0.03<br><code>reason: relevance_up(topic=${mainTopic})</code>`);
  } else if (action==='irrelevant'){
    state.feedback[evId] = {action, reason};
    state.weights[mainTopic] = Math.max(0.2, +(state.weights[mainTopic]-0.05).toFixed(2));
    state.weightLog.unshift({topic:mainTopic, delta:-0.05, at:'08-07', reason:`feedback:irrelevant(${reason})`});
    state.memFeedback.unshift({at:now, event:ev.title, action:'irrelevant', reason, effect:`${topicName(mainTopic)} −0.05 · 来源降噪 1/3`});
    toast(`已记录 <b>不相关（${reason}）</b> → <b>${topicName(mainTopic)}</b> 权重 −0.05，负反馈快速生效<br><code>reason: topic_weight_down</code> · 可在 Memory 页撤销`, 'warn');
  } else if (action==='save'){
    const was = state.feedback[evId] && state.feedback[evId].action==='save';
    state.feedback[evId] = was? null : {action};
    if(!was){
      state.memFeedback.unshift({at:now, event:ev.title, action:'save', effect:`entity:${ev.entity} 收藏`});
      toast(`已收藏 → Entity Memory：<b>${ev.entity}</b>（用于相关性与新颖度）`);
    }
  } else if (action==='later'){
    const i = state.laterIds.indexOf(evId);
    if(i>=0) state.laterIds.splice(i,1); else { state.laterIds.push(evId); toast('已加入稍后再看（不占用今日配额）'); }
  } else if (action==='undo'){
    delete state.feedback[evId];
    toast('已撤销该反馈 → 对应权重调整已回滚（feedback delta rollback）');
  }
  state.pendingReason = null;
}

/* ---------------- card render ---------------- */
function scoreBreakdown(ev, compact){
  const weights = {Relevance:'35%', Impact:'25%', Novelty:'15%', Credibility:'15%', Urgency:'10%'};
  return Object.entries(ev.dims).map(([k,v])=>`
    <div class="scoreline"><span class="dim">${k} · ${weights[k]}</span>
      <span class="bar"><span class="fill" style="width:${v}%"></span></span>
      <span class="val">${v}</span></div>`).join('') +
    (compact? '' : `<details class="reasons"><summary>为什么是这个分数（reason codes）</summary>
      <div class="reason-codes">${ev.reasons.map(r=>`<span class="rc">${r}</span>`).join('')}</div></details>`);
}

function eventCard(ev){
  const fb = feedbackState(ev);
  const faded = fb && fb.action==='irrelevant';
  const later = state.laterIds.includes(ev.id);
  return `<div class="ev-card ${ev.tier} ${faded?'faded':''}">
    <div class="ev-head">
      <div>
        <div class="ev-title" data-act="open" data-id="${ev.id}">${ev.title}</div>
        <div class="ev-meta">
          <span class="chip type">${ev.entity}</span>
          <span class="chip ${ev.typeCls}">${ev.type}</span>
          ${ev.topics.map(t=>`<span class="chip">${topicName(t)}</span>`).join('')}
          <span class="chip">⏱ ${ev.occurred.split('（')[0]}</span>
          ${later?'<span class="chip blue">◷ 稍后再看</span>':''}
        </div>
      </div>
      <div class="score-badge ${ev.tier}">${ev.total}</div>
    </div>
    <div class="ev-why"><b>Why it matters：</b>${ev.card.why}</div>
    ${scoreBreakdown(ev, true)}
    ${feedbackBar(ev)}
  </div>`;
}

/* ---------------- router ---------------- */
function render(){
  const hash = location.hash || '#/today';
  const m = hash.match(/^#\/event\/(.+)$/);
  let html;
  if (m) html = pageEvent(m[1]);
  else if (hash==='#/watchlist') html = pageWatchlist();
  else if (hash==='#/radar') html = pageRadar();
  else if (hash==='#/memory') html = pageMemory();
  else if (hash==='#/sources') html = pageSources();
  else if (hash==='#/jobs') html = pageJobs();
  else if (hash==='#/settings') html = pageSettings();
  else html = pageToday();
  $('#view').innerHTML = html;
}

window.addEventListener('hashchange', render);

document.body.addEventListener('click', e=>{
  const nav = e.target.closest('.nav-item[data-nav]');
  if (nav){ location.hash = '#/' + nav.dataset.nav; return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  const ev = EVENTS.find(x=>x.id===id);

  switch(act){
    case 'open': location.hash = '#/event/'+id; break;
    case 'back-today': location.hash = '#/today'; break;
    case 'mem-tab': state.memTab = id; render(); break;

    case 'fb-useful': applyFeedback(id,'useful'); render(); break;
    case 'fb-save': applyFeedback(id,'save'); render(); break;
    case 'fb-later': applyFeedback(id,'later'); render(); break;
    case 'fb-undo': applyFeedback(id,'undo'); render(); break;
    case 'fb-irrelevant': state.pendingReason = id; render(); break;
    case 'reason-cancel': state.pendingReason = null; render(); break;
    case 'reason-pick': applyFeedback(id,'irrelevant',el.dataset.reason); render(); break;
    case 'fb-rollback': {
      const f = state.memFeedback[+id];
      state.memFeedback.splice(+id,1);
      toast(`已撤销反馈「${f.event}」→ 对应权重 delta 回滚（显式 &gt; 隐式，可撤销）`);
      render(); break;
    }

    case 'mem-edit': toast('原型演示：此处打开权重编辑对话框（Edit 后立即生效）'); break;
    case 'mem-del': toast('已删除该 Research Memory → 立即停止参与排序，并从后续备份周期清除','warn'); break;
    case 'mem-ent-forget': toast(`已 Forget「${id}」→ 该实体不再参与相关性与新颖度计算`,'warn'); break;
    case 'pause-learning': toast('Pause learning：已暂停全部自动偏好学习（显式设置仍然生效）','warn'); break;
    case 'research-toggle': {
      const r = state.research.find(x=>x.id===id);
      r.status = r.status==='active'?'paused':'active';
      toast(r.status==='active'
        ? `已恢复研究「${r.name}」→ 重新获得短期高权重（近期 Research &gt; 久远行为）`
        : `已暂停研究「${r.name}」→ 不再加成相关事件`, 'warn');
      render(); break;
    }

    case 'src-retry': {
      const s = SOURCES.find(x=>x.id===id);
      s.status='warn'; s.err='手动重试中…'; render();
      setTimeout(()=>{ s.status='ok'; s.err=''; s.fails=0; s.last='刚刚';
        toast(`来源 <b>${id}</b> 重试成功 → 状态恢复正常（写入 source_run）`);
        if(location.hash==='#/sources') render(); }, 1400);
      break;
    }

    case 'wl-add': {
      const v = $('#wl-input').value.trim();
      if(!v){ toast('请先粘贴 URL','err'); break; }
      toast(`可采集性检查通过：<b>${v}</b> 已识别为 RSS 来源并加入 Watchlist（首次采集将限制回填近 7 天）`);
      $('#wl-input').value='';
      break;
    }
    case 'wl-topic-pause': toast(`已暂停 Topic「${topicName(id)}」→ 不再参与评分与推荐（可随时恢复）`,'warn'); break;
    case 'wl-topic-del': toast(`已删除 Topic「${topicName(id)}」→ 相关 Memory 保留，仅解除 Watch 关系`,'warn'); break;
    case 'wl-ent-pause': toast(`已暂停实体「${id}」`,'warn'); break;
    case 'wl-ent-del': toast(`已从 Watchlist 删除「${id}」（历史事件与 Memory 不受影响）`,'warn'); break;

    case 'job-run': toast('已触发手动 daily job → job_run 获取租约锁，防止与 07:00 Cron 重复执行'); break;
    case 'save-settings': toast('设置已保存 → profile.settings_json 更新（Zod 校验通过）'); break;
  }
});

render();
</script>
</body>
</html>
